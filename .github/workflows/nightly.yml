# Tier 6 (TESTING.md): the real stack against a real MAGPIE `contribute`.
# Every contract bug the audit found in MAGPIE was invisible to both
# repositories' unit tests and obvious the first time a real task ran
# (AUDIT_FINDINGS.md F14). This runs one small job of every type and asserts
# the results land.
name: Nightly MAGPIE end-to-end

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      magpie_ref:
        description: MAGPIE branch or commit to test
        default: birdtest-contribute

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jvc56/MAGPIE
          ref: ${{ inputs.magpie_ref || 'birdtest-contribute' }}
          path: magpie
      - name: Cache MAGPIE data
        id: magpie-data
        uses: actions/cache@v4
        with:
          path: |
            magpie/data/*
            magpie/testdata/*
          key: magpie-data-${{ hashFiles('magpie/download_data.sh', 'magpie/convert_lexica.sh') }}
      - name: Download MAGPIE data
        if: steps.magpie-data.outputs.cache-hit != 'true'
        working-directory: magpie
        run: ./download_data.sh && ./convert_lexica.sh
      - name: Build MAGPIE
        working-directory: magpie
        run: make magpie BUILD=release

      - name: Start the stack
        env:
          # Input-data imports resolve MAGPIE-DATA refs through the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker compose up -d --build --wait postgres minio minio-init backend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: One real task of every job type
        run: >-
          python3 scripts/e2e_magpie.py
          --magpie magpie/bin/magpie
          --magpie-root magpie

      - name: Backend log
        if: always()
        run: docker compose logs --no-color backend | tail -n 300
