name: MAGPIE hosting
on:
  pull_request:
    paths:
      - 'infra/magpie/**'
      - 'scripts/*magpie*'
      - '.github/workflows/magpie-hosting.yml'
  push:
    branches: [main]
    paths:
      - 'infra/magpie/**'
      - 'scripts/*magpie*'
      - '.github/workflows/magpie-hosting.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform -chdir=infra/magpie fmt -check
      - run: terraform -chdir=infra/magpie init -backend=false -input=false
      - run: terraform -chdir=infra/magpie validate
      - run: terraform -chdir=infra/magpie test
      - run: node scripts/magpie-entry-test.cjs
      - run: python3 -m unittest discover -s scripts -p test_publish_magpie.py
