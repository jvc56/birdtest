# Per pull request, cheapest first (TESTING.md, "Per pull request"): the
# backend's unit, contract and integration tests against a Postgres service,
# the frontend's type check and build, and both images the deployment runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: birdtest
          POSTGRES_PASSWORD: birdtest
          POSTGRES_DB: birdtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U birdtest -d birdtest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      # The integration tests clone a template database per test on this
      # server; they fail rather than skip without it.
      TEST_DATABASE_URL: postgres://birdtest:birdtest@localhost:5432/birdtest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo test --locked

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend image
        run: docker build -f docker/Dockerfile --target backend -t birdtest-backend .
      - name: Frontend image
        run: docker build -t birdtest-frontend frontend
