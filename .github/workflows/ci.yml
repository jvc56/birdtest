# Per pull request, cheapest first (TESTING.md, "Per pull request"): the
# backend's lint, unit, contract and integration tests against a Postgres
# service, the frontend's type check and build, both images the deployment
# runs, the end-to-end journeys, the Terraform, and MAGPIE's half of the
# contract fixtures.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: birdtest
          POSTGRES_PASSWORD: birdtest
          POSTGRES_DB: birdtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U birdtest -d birdtest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      # The integration tests clone a template database per test on this
      # server; they fail rather than skip without it.
      TEST_DATABASE_URL: postgres://birdtest:birdtest@localhost:5432/birdtest
      # The tests that are about the object store make a bucket each here.
      TEST_S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      # Not a service container: MinIO's image needs `server <dir>` as its
      # command, which `services` cannot pass.
      - name: MinIO for the object-store tests
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=birdtest -e MINIO_ROOT_PASSWORD=birdtestbirdtest \
            minio/minio:latest server /data
          until curl -fsS http://localhost:9000/minio/health/live; do sleep 1; done
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds MAGPIE from the pinned commit as well as the Rust binary, so a
      # commit that no longer compiles -- or a Dockerfile that stops copying
      # the binary in -- is caught here rather than by a backend that refuses
      # to bind in production.
      - name: Backend image
        run: docker build -f docker/Dockerfile --target backend -t birdtest-backend .
      # Mounts a board layout and runs from it, the way the server's scratch
      # directories do: MAGPIE loads a default layout before it parses any
      # argument, and the image deliberately carries no data directory. The
      # grep is the check -- MAGPIE reports failures on stderr and exits 0, so
      # running it bare would pass whatever happened.
      - name: The image's MAGPIE reports its builders
        run: |
          docker run --rm \
            -v "$PWD/backend/src/magpie_standard15.txt:/probe/data/layouts/standard15.txt:ro" \
            -w /probe --entrypoint magpie birdtest-backend builders \
            | tee /dev/stderr | grep -q '"wmp_builder_version"'
      - name: Derived-file builder image
        run: docker build -f docker/Dockerfile --target derived-builder -t birdtest-derived-builder .
      - name: Frontend image
        run: docker build -t birdtest-frontend frontend

  # Tier 5: the whole stack in Docker and a real browser against the built
  # frontend, with fake workers supplying results (TESTING.md section 5).
  # e2e/run.sh builds the three images, brings the stack up as its own compose
  # project, seeds it, runs Playwright and tears it all down.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The backend refuses to start without a MAGPIE to run, and mounts the
      # one in MAGPIE_ROOT. No data: the server runs it in scratch
      # directories it fills itself. Built in the backend image's own base,
      # so the binary links against the glibc it will run on rather than the
      # runner's newer one.
      - uses: actions/checkout@v4
        with:
          repository: jvc56/MAGPIE
          ref: birdtest-contribute
          path: magpie
      - name: Build MAGPIE
        run: |
          docker run --rm -v "$PWD/magpie:/src" -w /src debian:bookworm-slim sh -c \
            'apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential >/dev/null \
             && make magpie BUILD=portable_release -j"$(nproc)"'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the seed's and Playwright's dependencies
        run: |
          pip install requests
          cd e2e && npm ci && npx playwright install --with-deps --only-shell chromium
      - name: End-to-end journeys
        run: e2e/run.sh
        env:
          MAGPIE_ROOT: ${{ github.workspace }}/magpie
          CARGO_BUILD_JOBS: "4"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore

  # Formatting and validation need no AWS credentials: `init -backend=false`
  # fetches the providers and nothing else. This is what caught a string with
  # unescaped quotes in variables.tf that made every `terraform init` fail.
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # MAGPIE's half of the contract. Each repository
  # tests against its own copy of the fixtures, so a fixture changed here and
  # not copied to MAGPIE would pass both suites while breaking the protocol.
  # This runs MAGPIE's contribute tests against *this* branch's fixtures.
  # It does not catch a MAGPIE-side change; the nightly end-to-end job does.
  magpie-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jvc56/MAGPIE
          ref: birdtest-contribute
          path: magpie
      - name: Use this branch's contract fixtures
        run: cp contract-fixtures/*.json magpie/test/birdtest_contract/
      - name: Cache MAGPIE data
        id: magpie-data
        uses: actions/cache@v4
        with:
          path: |
            magpie/data/*
            magpie/testdata/*
          key: magpie-data-${{ hashFiles('magpie/download_data.sh', 'magpie/convert_lexica.sh') }}
      - name: Download MAGPIE data
        if: steps.magpie-data.outputs.cache-hit != 'true'
        working-directory: magpie
        run: ./download_data.sh && ./convert_lexica.sh
      - name: Build and run MAGPIE's contribute tests
        working-directory: magpie
        run: make magpie_test && ./bin/magpie_test contribute
      # The derived-file builders, pinned by hash. birdtest publishes the
      # SHA-256 of the wordmap and rack info table its server built, and every
      # worker refuses one whose bytes differ -- so a builder change that
      # slipped through without a version bump would take the fleet down, job
      # by job, with `derived_mismatch`. This is the test that makes that
      # impossible to merge accidentally.
      - name: Check the derived-file builders against their pinned hashes
        working-directory: magpie
        run: ./bin/magpie_test builderhash
      # And the conversions birdtest's server actually invokes. A rename or a
      # changed positional argument here is a server that cannot build
      # anything, discovered on deploy rather than in CI.
      - name: Check the conversions birdtest invokes still exist
        working-directory: magpie
        run: |
          make magpie
          ./bin/magpie builders
          for conversion in dawg2wordmap klvwmp2rit rackequity2klv; do
            if ! ./bin/magpie help convert | grep -q "$conversion"; then
              echo "magpie no longer offers '$conversion', which birdtest runs" >&2
              exit 1
            fi
          done
