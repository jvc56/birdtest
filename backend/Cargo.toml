[package]
name = "birdtest"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
axum = "0.7"
axum-extra = { version = "0.9", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "set-header"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.5"
rand = "0.8"
pasetors = "0.7"
governor = "0.6"
zxcvbn = "2"
anyhow = "1"
dotenvy = "0.15"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
http-body-util = "0.1"
hex = "0.4"
sha2 = "0.10"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-sesv2 = "1"
async-stream = "0.3.6"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
# `ServiceExt::oneshot`, so integration tests drive the real router in-process.
tower = { version = "0.4", features = ["util"] }

# Argon2 unoptimised takes over a second a hash. The rate-limit tests make
# ten or eleven attempts inside a limiter that refills a token every six
# seconds, and at that speed a CI runner's window closed before the last
# attempt landed. Optimising the hashing crates alone keeps a debug build
# quick to compile and makes each hash a few milliseconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Password scoring: close to a second for a crafted password even optimized,
# so the tests that time it see what production does.
[profile.dev.package.zxcvbn]
opt-level = 3
