# The end-to-end stack's stand-in for GitHub (docker-compose.e2e.yml): the
# backend's GITHUB_API_URL and GITHUB_RAW_URL point here, so an input-data
# import resolves a ref and downloads a tarball without leaving the machine.
# Everything it serves is the static tree fixtures/build.sh writes under
# fixtures/github/; the tarballs themselves are symlinks to fixtures/data-*.
server {
    listen 80;
    server_name _;
    root /srv/fixtures/github;

    # `commits/main` is a bare sha with no extension. A missing ref or a chunk
    # that does not exist is nginx's ordinary 404, which is what import treats
    # as "no such ref" and "not chunked".
    default_type text/plain;

    location / {
        try_files $uri =404;
    }
}
