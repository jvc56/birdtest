services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: birdtest
      POSTGRES_PASSWORD: birdtest
      POSTGRES_DB: birdtest
    ports:
      # Override POSTGRES_PORT if 5432 is already taken on your machine.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: birdtest
      MINIO_ROOT_PASSWORD: birdtestbirdtest
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
