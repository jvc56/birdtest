# The birdtest stack: database, object storage, backend and frontend.
#
# The backend needs a MAGPIE build. It runs one for every wordmap, rack info
# table and leave-generation KLV, reads the builder versions out of the binary
# at startup, and refuses to bind without it — see MAGPIE_DEPENDENCY.md. Set
# MAGPIE_BIN to a local checkout's bin/magpie (`make magpie
# BUILD=portable_release`) and MAGPIE_ROOT to the checkout, which is mounted so
# the container can run it.
#
# For local development use `scripts/dev.py`, which brings this up, seeds it,
# and runs real `magpie contribute` processes against it. There is no "worker"
# service here: the contributor client is MAGPIE itself, running on the host.
#
# Optional profiles:
#   --profile dev           the Vite dev server with hot reload, alongside the
#                           production-style Nginx frontend
#
# And one service run on demand rather than kept up:
#   docker compose run --rm derived-builder
#                           drains the wordmap / rack info table build queue
#                           once and exits, the way the scheduled ECS task
#                           does in production. A job whose players ask for
#                           either file is not dispatched until this has run.
#
# The end-to-end suite runs this file plus docker-compose.e2e.yml as its own
# project (file mail, a stand-in for GitHub, and the fake workers, which are
# defined there and only there); use e2e/run.sh, which brings it up and tears
# it down.
#
# Ports are overridable so a host that already has something on 5432 (or 9000,
# or 5173) does not need the file edited. See .env.example.

name: birdtest

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: birdtest
      POSTGRES_PASSWORD: birdtest
      POSTGRES_DB: birdtest
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U birdtest -d birdtest"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Chainguard's builds of MinIO: MinIO stopped publishing its own images
  # (minio/minio and minio/mc are gone from Docker Hub and quay.io), and every
  # pull of them now fails. The server image is distroless; the client is the
  # -dev variant because the bucket loop below needs a shell.
  minio:
    image: cgr.dev/chainguard/minio:latest
    # Root, as MinIO's own image ran: this one defaults to uid 65532, which
    # cannot write a miniodata volume that image created, and refuses to start.
    user: "0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: birdtest
      MINIO_ROOT_PASSWORD: birdtestbirdtest
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  # One-shot: creates the artifact bucket the backend writes leave-generation
  # KLVs into. Retries rather than relying on a MinIO healthcheck, since the
  # server image does not ship a reliable one.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 birdtest birdtestbirdtest; do
          echo 'waiting for minio...'; sleep 1;
        done
        mc mb --ignore-existing local/birdtest-artifacts
        # Where scripts/backup.sh writes when it is pointed at the local stack
        # (AWS_S3_ENDPOINT=http://minio:9000). Production's backup bucket is a
        # separate bucket for the same reason: see PLAN.md, "Where the dump
        # runs, and where it lands".
        mc mb --ignore-existing local/birdtest-backups
    restart: on-failure

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: backend
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://birdtest:birdtest@postgres:5432/birdtest
      BIND_ADDR: 0.0.0.0:8080
      # Throwaway dev key, committed on purpose. Real environments get their
      # own from SSM.
      SESSION_SIGNING_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      SECURE_COOKIES: "false"
      # Confirmation codes and reset links go to this container's stdout:
      #   docker compose logs -f backend
      # The third backend, `file`, writes one file per message into
      # MAIL_OUTBOX_DIR, named by time and recipient, so a test reads the mail
      # addressed to it; docker-compose.e2e.yml switches to it for tier 5.
      MAIL_BACKEND: console
      MAIL_FROM: no-reply@birdtest.local
      PUBLIC_URL: http://localhost:${WEB_PORT:-5173}
      # Optional here, set in production: unauthenticated GitHub ref
      # resolution is 60 calls an hour per IP.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MAGPIE_DATA_REPO: ${MAGPIE_DATA_REPO:-jvc56/MAGPIE-DATA}
      # Import talks to GitHub unless these move it elsewhere: the e2e stack
      # points both at a static server of fixtures/, so import runs offline,
      # and the nightly MAGPIE smoke tier at the stand-in scripts/e2e_magpie.py
      # serves on the host (--github-fixture-port), which hands out a small
      # test tarball and passes every other request on to GitHub. Read from
      # BIRDTEST_-prefixed host variables, not the backend's own names: GitHub
      # Actions sets GITHUB_API_URL on every runner and refuses to let a
      # workflow override any GITHUB_* variable, so the nightly's stand-in
      # was silently replaced by the real API.
      GITHUB_API_URL: ${BIRDTEST_GITHUB_API_URL:-https://api.github.com}
      GITHUB_RAW_URL: ${BIRDTEST_GITHUB_RAW_URL:-https://raw.githubusercontent.com}
      # The fleet-wide floor. `birdtest-contribute` reports 0.1.1, which
      # meets it; scripts/dev.py reads the version
      # out of your checkout and sets this for you, so a checkout that reports
      # something else still runs locally.
      MIN_MAGPIE_VERSION: ${MIN_MAGPIE_VERSION:-0.1.1}
      # The pinned MAGPIE this process runs. The production image builds one in;
      # locally it comes from the mounted checkout, so a `make magpie` there is
      # picked up by a restart. The backend refuses to start without it.
      MAGPIE_BIN: /magpie/bin/magpie
      # One thread: the small conversions (a leave-generation KLV, a wordmap for
      # the tiny dev distribution) are all that run here. A rack info table in
      # production is a separate task with its own cores.
      MAGPIE_THREADS: "1"
      # Nginx appends the client address to X-Forwarded-For, and the per-IP
      # rate limits key on it. Requests to :8080 directly carry no header and
      # fall back to the peer address.
      TRUSTED_PROXY_HOPS: "1"
      S3_BUCKET: birdtest-artifacts
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: birdtest
      AWS_SECRET_ACCESS_KEY: birdtestbirdtest
      AWS_REGION: us-east-1
      RUST_LOG: ${RUST_LOG:-birdtest=debug,tower_http=info}
    # So BIRDTEST_GITHUB_API_URL can name a server on the host, as the nightly
    # smoke tier's does.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Read-only: the container runs the binary and reads nothing else from
      # the checkout. Every conversion gets a throwaway data directory written
      # from the bytes a job pins, so the checkout's own ./data is never
      # consulted -- which is the point, and worth keeping true in development
      # as well as in production.
      - ${MAGPIE_ROOT:-../MAGPIE}:/magpie:ro
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"

  # --- profile: dev ---------------------------------------------------------
  # Hot reload without Node on the host. node_modules lives in a named volume
  # so the container's install never collides with a host one on a different
  # platform.
  frontend-dev:
    profiles: [dev]
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BIRDTEST_API: http://backend:8080
      # Bind-mounted source does not always deliver inotify events.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${DEV_PORT:-5174}:5173"

  # --- on demand: derived-builder -------------------------------------------
  # The derived-file builder, as production runs it in a scheduled ECS task
  # (infra/derived.tf): the backend image with a different entrypoint, which
  # drains `derived_data` and exits. Nothing else in this stack builds a
  # wordmap or a rack info table, so a job that asks for one sits undispatched
  # -- visible at /admin/derived-data -- until this is run:
  #
  #   docker compose run --rm derived-builder
  #
  # Under a profile so `up` does not start it: it is a one-shot, and the
  # scheduled task it stands in for is the thing that decides when it runs.
  # `run` enables the profile on its own. The same mounted MAGPIE the backend
  # runs, so the builder recorded beside every hash is the server's.
  derived-builder:
    profiles: [builder]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: derived-builder
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://birdtest:birdtest@postgres:5432/birdtest
      # Required by the shared configuration, never used: this process mints
      # no session.
      SESSION_SIGNING_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      MIN_MAGPIE_VERSION: ${MIN_MAGPIE_VERSION:-0.1.1}
      MAGPIE_BIN: /magpie/bin/magpie
      MAGPIE_THREADS: "${MAGPIE_THREADS:-2}"
      S3_BUCKET: birdtest-artifacts
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: birdtest
      AWS_SECRET_ACCESS_KEY: birdtestbirdtest
      AWS_REGION: us-east-1
      RUST_LOG: ${RUST_LOG:-birdtest=info}
    volumes:
      - ${MAGPIE_ROOT:-../MAGPIE}:/magpie:ro

volumes:
  pgdata:
  miniodata:
  frontend_node_modules:
